<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบบันทึกผลการพัฒนาคุณภาพผู้เรียนรายวิชา — โรงเรียนเซนต์เทเรซา</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Noto+Serif+Thai:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6fb;--surface:#ffffff;--border:#d7e2ee;--text:#1c2b3a;--text2:#51687e;--accent:#154d8b;--accent2:#0e3763;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{max-width:560px;width:100%}
.logo-box{width:64px;height:64px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.logo-box img{width:100%;height:100%;object-fit:cover}
h1{font-family:'Noto Serif Thai',serif;font-size:24px;margin-bottom:6px;text-align:center}
.sub{color:var(--text2);text-align:center;margin-bottom:28px;font-size:14px}
.grp{margin-bottom:22px}
.grp-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
a.card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:10px;text-decoration:none;color:var(--text);box-shadow:0 2px 12px rgba(0,0,0,.06);transition:transform .15s}
a.card:hover{transform:translateY(-2px);border-color:var(--accent)}
a.card b{color:var(--accent2);font-size:15px}
a.card span{display:block;color:var(--text2);font-size:12.5px;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-box" id="pageLogo">📋</div>
  <h1>แบบบันทึกผลการพัฒนาคุณภาพผู้เรียนรายวิชา</h1>
  <div class="sub">โรงเรียนเซนต์เทเรซา</div>

  <div class="grp">
    <div class="grp-title">ระบบบันทึกผ่าน Google Sheets (ล่าสุด)</div>
    <a class="card" href="332 (ล่าสุด)/หน้าเว็บแอดมิน.html"><b>🔑 หน้าเว็บแอดมิน</b><span>จัดการนักเรียน / รายวิชา / คะแนน / เวลาเรียน — สิทธิ์เต็ม</span></a>
    <a class="card" href="332 (ล่าสุด)/หน้าเว็บครู.html"><b>👩‍🏫 หน้าเว็บครู</b><span>บันทึกคะแนนและเวลาเรียนเท่านั้น</span></a>
  </div>
</div>
<script>
(async function(){
  const WEB_APP_URL='https://script.google.com/macros/s/AKfycbwDXOgWGqWpdUOfxH_3R7WwvkQ8S_wpArHZDcv3NAvmODn0CY5IeFFlLI6Ep3TEqJQW/exec';
  try{
    const res=await fetch(WEB_APP_URL+'?type=settings');
    const s=await res.json();
    if(s&&s.logoUrl)document.getElementById('pageLogo').innerHTML=`<img src="${s.logoUrl}">`;
  }catch(err){}
})();
</script>
</body>
</html>
